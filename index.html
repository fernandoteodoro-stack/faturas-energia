<title>Faturas de Energia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#0e1a24;--card:#16232e;--card2:#101c25;--tx:#e9f0f3;--tx2:#8ba0ab;--verde:#3ecf8e;--line:#2a3444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 'IBM Plex Sans',system-ui,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.mono,td.num,#corpo td:first-child b,#corpo td:last-child{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;margin:0 0 2px}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.atu{display:flex;align-items:center;gap:10px}
#carimbo{color:var(--tx2);font-size:12px}
.btnatu{background:var(--verde);color:#08221a;border:none;border-radius:10px;padding:8px 14px;font:600 13px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer}
.btnatu:hover{filter:brightness(1.08)}
.volta{background:none;border:none;color:var(--tx2);font:600 14px 'IBM Plex Sans',sans-serif;cursor:pointer;padding:0;margin:0 0 10px}
.volta:hover{color:var(--verde)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.bcard{background:var(--card);border:1px solid #26304255;border-radius:16px;padding:18px;cursor:pointer;transition:.12s}
.bcard:hover{border-color:var(--verde);transform:translateY(-2px)}
.bcard h3{margin:0 0 2px;font-size:17px}.bcard .cnt{color:var(--tx2);font-size:13px;margin-bottom:6px}
.bcard .clg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;margin-top:2px;font-size:12px;color:var(--tx2)}
.nav{display:flex;align-items:center;gap:14px;margin:6px 0 20px}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--tx);width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer}
.nav button:hover{border-color:var(--verde)}.nav b{font-size:18px;min-width:150px;text-align:center;text-transform:capitalize}
.top{display:grid;grid-template-columns:360px 1fr;gap:18px;margin-bottom:22px}
@media(max-width:760px){.top{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid #26304255;border-radius:16px;padding:20px}
.rosca{display:flex;flex-direction:column;align-items:center}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:6px}
.lg{font-size:13px;color:var(--tx2)}.lg b{color:var(--tx)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.kpi{background:var(--card2);border-radius:14px;padding:16px 18px}
.kpi .v{font-size:26px;font-weight:800}.kpi .l{color:var(--tx2);font-size:12px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #26304240}
th{color:var(--tx2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.ctr,th.ctr{text-align:center}
.sub{color:var(--tx2);font-size:11px}.chip{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filtros button{background:var(--card);border:1px solid var(--line);color:var(--tx2);border-radius:20px;padding:6px 14px;font:600 13px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer}
.filtros button b{color:var(--tx);margin-left:2px}
.filtros button.ativo{color:var(--tx);border-color:var(--verde);box-shadow:inset 0 0 0 1px var(--verde)}
.busca{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 14px;font:15px 'IBM Plex Sans',system-ui,sans-serif;margin:0 0 12px}
.busca::placeholder{color:var(--tx2)}.busca:focus{outline:none;border-color:var(--verde);box-shadow:inset 0 0 0 1px var(--verde)}
.tbl{overflow-x:auto}
</style>

const NOMES={paga:"Pagas",financeiro:"No financeiro",pre_nota:"Pré-nota",sem_fatura:"Sem fatura no mês"};
const CORES={paga:"#3ecf8e",financeiro:"#4da3ff",pre_nota:"#f5b73d",sem_fatura:"#5b667a"};
const ORDEM=["paga","financeiro","pre_nota","sem_fatura"];
let baseIdx=null, idx=0, filtro=null, busca="", filtroCons=null, buscaCons="";
const fmt=v=>v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const rotMes=c=>{const[m,a]=c.split("/");return new Date(a,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});};

function contMes(base,mes){const dm=base.porMes[mes]||{};const c={paga:0,financeiro:0,pre_nota:0,sem_fatura:0};
  base.ucs.forEach(u=>{const f=dm[u.uc];c[f?f.status:"sem_fatura"]++;});return c;}

function meiaRosca(cont,total,R){
  const r=Math.round(R*0.61),cx=R+18,cy=R+14,W=cx*2,H=cy+22;let ang=Math.PI,paths="";
  const arco=(a0,a1,rad)=>[cx+rad*Math.cos(a0),cy-rad*Math.sin(a0),cx+rad*Math.cos(a1),cy-rad*Math.sin(a1),(a0-a1)>Math.PI?1:0];
  for(const s of ORDEM){const q=cont[s]||0;if(!q)continue;const a1=ang-(q/total)*Math.PI;
    const o=arco(ang,a1,R),io=arco(ang,a1,r);
    paths+=`<path d="M ${o[0].toFixed(1)} ${o[1].toFixed(1)} A ${R} ${R} 0 ${o[4]} 1 ${o[2].toFixed(1)} ${o[3].toFixed(1)} L ${io[2].toFixed(1)} ${io[3].toFixed(1)} A ${r} ${r} 0 ${o[4]} 0 ${io[0].toFixed(1)} ${io[1].toFixed(1)} Z" fill="${CORES[s]}"/>`;ang=a1;}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px"><g>${paths}</g>
   <text x="${cx}" y="${cy-R*0.12}" text-anchor="middle" font-size="${Math.round(R*0.3)}" font-weight="800" fill="#e9f0f3">${total}</text>
   <text x="${cx}" y="${cy+R*0.06}" text-anchor="middle" font-size="${Math.round(R*0.1)}" fill="#8ba0ab">UCs</text></svg>`;
}

let mesesTodos=null, idxCons=-1;
function getMeses(){
  if(!mesesTodos){const s=new Set();DADOS.bases.forEach(b=>b.meses.forEach(m=>s.add(m)));
    mesesTodos=[...s].sort((a,b)=>(a.slice(3)+a.slice(0,2)).localeCompare(b.slice(3)+b.slice(0,2)));}
  return mesesTodos;
}
function contConsol(mes){const c={paga:0,financeiro:0,pre_nota:0,sem_fatura:0};
  DADOS.bases.forEach(b=>{const x=contMes(b,mes);ORDEM.forEach(s=>c[s]+=x[s]);});return c;}
function valMes(b,mes){const dm=b.porMes[mes]||{};return b.ucs.reduce((s,u)=>s+((dm[u.uc]&&dm[u.uc].valor)||0),0);}
function mudarCons(d){const m=getMeses();idxCons=Math.max(0,Math.min(m.length-1,idxCons+d));renderLanding();}
function linhasConsol(mes){const out=[];DADOS.bases.forEach(b=>{const dm=b.porMes[mes]||{};b.ucs.forEach(u=>{const f=dm[u.uc];out.push({base:b.nome,u,f,st:f?f.status:"sem_fatura"});});});return out;}
function setFiltroCons(s){filtroCons=(!s||filtroCons===s)?null:s;renderConsArea();}
function setBuscaCons(v){buscaCons=v;renderConsArea();}
function renderConsArea(){
  const meses=getMeses();const mes=meses[idxCons];
  const cons=contConsol(mes),totG=DADOS.bases.reduce((a,b)=>a+b.ucs.length,0);
  const botC=[["","Todas",totG]].concat(ORDEM.filter(s=>cons[s]).map(s=>[s,NOMES[s],cons[s]]));
  const filtrosC=botC.map(([s,n,q])=>`<button class="${(filtroCons===s||(!filtroCons&&s===''))?'ativo':''}" onclick="setFiltroCons('${s}')">${n} <b>${q}</b></button>`).join("");
  const q=buscaCons.trim().toLowerCase(),qd=q.replace(/\D/g,"");
  let vis=linhasConsol(mes);
  if(filtroCons) vis=vis.filter(x=>x.st===filtroCons);
  if(q) vis=vis.filter(x=>{const ud=x.u.uc.replace(/\D/g,"");return (qd&&ud.includes(qd))||x.u.uc.toLowerCase().includes(q)||(x.u.proj||"").toLowerCase().includes(q)||x.base.toLowerCase().includes(q);});
  vis.sort((a,b)=>ORDEM.indexOf(a.st)-ORDEM.indexOf(b.st)||a.base.localeCompare(b.base)||a.u.uc.localeCompare(b.u.uc));
  let tabC="";
  if(filtroCons||q){
    tabC=`<div class="tbl" style="margin-top:6px"><table><thead><tr><th>Base</th><th>UC / Projeto</th><th>Status</th><th>Emissão</th><th>Venc.</th><th class="num">Valor</th><th>Documento</th></tr></thead><tbody>`+
      (vis.length?vis.map(({base,u,f,st})=>`<tr><td>${base}</td><td><b>${u.uc}</b><br><span class="sub">${u.proj||""}</span></td><td><span class="chip" style="background:${CORES[st]}22;color:${CORES[st]}">${NOMES[st]}</span></td><td>${f?f.emissao:"—"}</td><td>${f?f.venc:"—"}</td><td class="num">${f?"R$ "+fmt(f.valor):"—"}</td><td>${f?f.doc:"—"}</td></tr>`).join(""):`<tr><td colspan="7" style="color:var(--tx2);padding:16px">Nenhuma UC encontrada.</td></tr>`)+
      `</tbody></table></div>`;
  }
  document.getElementById("consArea").innerHTML=`<div class="filtros" style="margin-top:16px">${filtrosC}</div>${tabC}`;
}

function renderLanding(){
  const meses=getMeses();
  if(idxCons<0){ let bi=meses.length-1,bn=-1;
    meses.forEach((m,i)=>{const c=contConsol(m);const n=c.paga+c.financeiro+c.pre_nota;if(n>=bn){bn=n;bi=i;}});
    idxCons=bi;
  } else if(idxCons>=meses.length) idxCons=meses.length-1;
  const mes=meses[idxCons];
  const cons=contConsol(mes), totG=DADOS.bases.reduce((a,b)=>a+b.ucs.length,0);
  const val=DADOS.bases.reduce((a,b)=>a+valMes(b,mes),0);
  const legC=ORDEM.filter(s=>cons[s]).map(s=>`<span class="lg"><span class="dot" style="background:${CORES[s]}"></span>${NOMES[s]} <b>${cons[s]}</b></span>`).join("");
  const cards=DADOS.bases.map((b,i)=>{
    const c=contMes(b,mes);
    const leg=ORDEM.filter(s=>c[s]).map(s=>`<span><span class="dot" style="background:${CORES[s]}"></span>${NOMES[s]} <b style="color:var(--tx)">${c[s]}</b></span>`).join("");
    return `<div class="bcard" onclick="abrirBase(${i})">
      <h3>🏭 ${b.nome}</h3><div class="cnt">${b.ucs.length} UCs</div>
      ${meiaRosca(c,b.ucs.length||1,86)}<div class="clg">${leg}</div></div>`;
  }).join("");
  document.getElementById("app").innerHTML=`
    <div class="nav"><button onclick="mudarCons(-1)">‹</button><b id="rotC">${rotMes(mes)}</b><button onclick="mudarCons(1)">›</button></div>
    <div class="card" style="margin-bottom:24px">
      <div style="font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px">📊 Consolidado — todas as bases (${DADOS.bases.length}) · só UCs ativas</div>
      <div class="top">
        <div class="rosca">${meiaRosca(cons,totG,150)}<div class="leg">${legC}</div></div>
        <div class="kpis">
          <div class="kpi"><div class="v">${totG-cons.sem_fatura}/${totG}</div><div class="l">UCs com fatura no mês</div></div>
          <div class="kpi"><div class="v" style="color:var(--verde)">R$ ${fmt(val)}</div><div class="l">Valor faturado no mês</div></div>
          <div class="kpi"><div class="v">${cons.paga}</div><div class="l">Pagas</div></div>
          <div class="kpi"><div class="v">${cons.financeiro+cons.pre_nota}</div><div class="l">Em aberto (fin.+pré-nota)</div></div>
        </div>
      </div>
      <input id="buscaCons" class="busca" style="margin-top:16px" type="text" autocomplete="off" placeholder="🔍 Pesquisar UC em todas as bases — com ou sem pontos e traços" oninput="setBuscaCons(this.value)">
      <div id="consArea"></div>
    </div>
    <div class="grid">${cards}</div>`;
  const bc=document.getElementById("buscaCons");if(bc)bc.value=buscaCons;
  renderConsArea();
}
function abrirBase(i){baseIdx=i;const b=DADOS.bases[i];let bi=b.meses.length-1,bn=-1;
  b.meses.forEach((m,k)=>{const c=contMes(b,m);const n=c.paga+c.financeiro+c.pre_nota;if(n>=bn){bn=n;bi=k;}});
  idx=bi;filtro=null;busca="";renderDetalhe();}
function voltar(){baseIdx=null;renderLanding();}
function setFiltro(s){filtro=(!s||filtro===s)?null:s;renderDetalhe();}
function setBusca(v){busca=v;renderDetalhe();}
function mudar(d){const b=DADOS.bases[baseIdx];idx=Math.max(0,Math.min(b.meses.length-1,idx+d));renderDetalhe();}

function renderDetalhe(){
  const b=DADOS.bases[baseIdx];const mes=b.meses[idx]||"—";const dm=b.porMes[mes]||{};
  const app=document.getElementById("app");
  if(!document.getElementById("det")){
    app.innerHTML=`<button class="volta" onclick="voltar()">‹ Voltar às bases</button>
      <div id="det"><h2 id="bt" style="margin:0 0 12px;font-size:18px"></h2>
      <div class="nav"><button onclick="mudar(-1)">‹</button><b id="rot">—</b><button onclick="mudar(1)">›</button></div>
      <div class="top"><div class="card rosca"><div id="svg"></div><div class="leg" id="leg"></div></div><div class="kpis" id="kpis"></div></div>
      <input id="busca" class="busca" type="text" autocomplete="off" placeholder="🔍 Pesquisar UC — com ou sem pontos e traços" oninput="setBusca(this.value)">
      <div class="filtros" id="filtros"></div>
      <div class="card"><div class="tbl"><table><thead><tr><th>UC / Projeto</th><th>Status no mês</th><th>Emissão</th><th>Venc.</th><th class="num">Valor</th><th class="ctr">PDF</th><th>Documento</th></tr></thead><tbody id="corpo"></tbody></table></div></div></div>`;
    const bi=document.getElementById("busca");if(bi)bi.value=busca;
  }
  document.getElementById("bt").textContent="🏭 "+b.nome;
  document.getElementById("rot").textContent=rotMes(mes);
  const cont=contMes(b,mes),total=b.ucs.length;
  document.getElementById("svg").innerHTML=meiaRosca(cont,total,150);
  document.getElementById("leg").innerHTML=ORDEM.filter(s=>cont[s]).map(s=>`<span class="lg"><span class="dot" style="background:${CORES[s]}"></span>${NOMES[s]} <b>${cont[s]}</b></span>`).join("");
  const linhas=b.ucs.map(u=>{const f=dm[u.uc];return{u,f,st:f?f.status:"sem_fatura"};});
  const val=linhas.reduce((a,x)=>a+(x.f?x.f.valor:0),0);
  document.getElementById("kpis").innerHTML=
    `<div class="kpi"><div class="v">${total-cont.sem_fatura}/${total}</div><div class="l">UCs com fatura no mês</div></div>
     <div class="kpi"><div class="v" style="color:var(--verde)">R$ ${fmt(val)}</div><div class="l">Valor faturado no mês</div></div>
     <div class="kpi"><div class="v">${cont.paga}</div><div class="l">Pagas</div></div>
     <div class="kpi"><div class="v">${cont.financeiro+cont.pre_nota}</div><div class="l">Em aberto (fin.+pré-nota)</div></div>`;
  const bot=[["","Todas",total]].concat(ORDEM.map(s=>[s,NOMES[s],cont[s]||0]));
  document.getElementById("filtros").innerHTML=bot.map(([s,n,q])=>`<button class="${(filtro===s||(!filtro&&s===''))?'ativo':''}" onclick="setFiltro('${s}')">${n} <b>${q}</b></button>`).join("");
  const q=busca.trim().toLowerCase(),qd=q.replace(/\D/g,"");
  const vis=(filtro?linhas.filter(x=>x.st===filtro):linhas)
    .filter(x=>{if(!q)return true;const ud=x.u.uc.replace(/\D/g,"");return (qd&&ud.includes(qd))||x.u.uc.toLowerCase().includes(q)||(x.u.proj||"").toLowerCase().includes(q);})
    .sort((a,b2)=>ORDEM.indexOf(a.st)-ORDEM.indexOf(b2.st)||a.u.uc.localeCompare(b2.u.uc));
  document.getElementById("corpo").innerHTML=vis.length?vis.map(({u,f,st})=>
    `<tr><td><b>${u.uc}</b><br><span class="sub">${u.proj||""}</span></td>
     <td><span class="chip" style="background:${CORES[st]}22;color:${CORES[st]}">${NOMES[st]}</span></td>
     <td>${f?f.emissao:"—"}</td><td>${f?f.venc:"—"}</td><td class="num">${f?"R$ "+fmt(f.valor):"—"}</td>
     <td class="ctr">${u.pdf?"✅":"—"}</td><td>${f?f.doc:"—"}</td></tr>`).join("")
    :`<tr><td colspan="7" style="color:var(--tx2);padding:16px">Nenhuma UC encontrada.</td></tr>`;
}
document.getElementById("carimbo").textContent = "Atualizado em " + (DADOS.gerado||"");
renderLanding();
</script>
